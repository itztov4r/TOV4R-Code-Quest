name: Quest checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check core.js && node --check curriculum.js && node --check cloud.js && node --check premium-dashboard.js
      - run: node --test tests/*.test.*
